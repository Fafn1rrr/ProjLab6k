<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Drukāšanas plānošana{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap.min.css') }}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('pages.index') }}">Drukāšanas plānošana</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-label="Izvēlne">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="{{ url_for('pages.books') }}">1. Grāmatas</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('pages.orders') }}">2. Pasūtījumi</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('pages.machines') }}">3. Iekārtas</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('pages.processing_times') }}">4. Apstrādes laiki</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('pages.plan') }}">5. Aprēķināt plānu</a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="container pb-5">
  {% for category, message in get_flashed_messages(with_categories=true) %}
    <div class="alert alert-{{ category }}">{{ message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>

<script src="{{ url_for('static', filename='vendor/bootstrap.bundle.min.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
